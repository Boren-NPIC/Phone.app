<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KhmerDub Studio Pro - Multi-User Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#06b6d4', 600: '#0891b2' },
                        studio: { base: '#080c14', panel: '#0f172a', card: '#1b2436', border: '#2d3748' }
                    },
                    fontFamily: { sans: ['"Kantumruy Pro"', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-studio-base text-slate-200 font-sans min-h-screen flex flex-col overflow-x-hidden select-none">

    <!-- TOP APP BAR -->
    <header
        class="py-2.5 px-3 sm:px-4 border-b border-studio-border bg-studio-panel flex flex-wrap items-center justify-between gap-2 flex-shrink-0 z-30">
        <div class="flex items-center gap-2">
            <div
                class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow">
                <i data-lucide="zap" class="w-4 h-4 fill-white"></i>
            </div>
            <div>
                <span class="text-xs sm:text-sm font-bold text-white uppercase tracking-wider">KhmerDub Pro</span>
                <span
                    class="text-[9px] px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold ml-1">MULTI-USER</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
            <label
                class="cursor-pointer flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs text-white font-medium transition shadow active:scale-95">
                <input type="file" id="batchUploadInput" multiple accept="video/*" class="hidden"
                    onchange="onFilesChosen(event)">
                <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
                <span>+ ថែមរឿងភាគ</span>
            </label>

            <button id="btnTranscribe" onclick="runTranscribeSingle()" disabled
                class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-gradient-to-r from-rose-600 to-indigo-600 hover:from-rose-500 text-xs text-white font-semibold transition shadow active:scale-95 disabled:opacity-40">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span id="txtTranscribe">Transcribe ភាគនេះ</span>
            </button>

            <button id="btnExport" onclick="runExportBatch()" disabled
                class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-xs text-white font-semibold transition shadow active:scale-95 disabled:opacity-40">
                <i data-lucide="play" class="w-3.5 h-3.5 fill-white"></i>
                <span>Export ទាំងអស់</span>
            </button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="flex-1 flex flex-col lg:flex-row">

        <!-- LEFT: EPISODES -->
        <aside
            class="w-full lg:w-64 border-b lg:border-b-0 lg:border-r border-studio-border bg-studio-panel flex flex-col flex-shrink-0">
            <div class="p-2.5 border-b border-studio-border flex items-center justify-between text-xs">
                <span class="font-bold text-slate-300 text-[11px] flex items-center gap-1.5">
                    <i data-lucide="film" class="w-3.5 h-3.5 text-cyan-400"></i> ជួររឿងភាគរបស់អ្នក
                </span>
                <button onclick="clearAllProjectEpisodes()"
                    class="px-2 py-0.5 rounded bg-rose-950/60 hover:bg-rose-600 border border-rose-500/50 text-rose-300 hover:text-white text-[10px] flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3 h-3"></i> <span>សម្អាត</span>
                </button>
            </div>

            <div id="epList" class="p-2 space-y-1.5 max-h-48 lg:max-h-none overflow-y-auto">
                <div class="text-center p-3 text-slate-500 text-xs">សូមចុច "+ ថែមរឿងភាគ"</div>
            </div>
        </aside>

        <!-- CENTER: SCRIPT -->
        <main class="w-full flex-1 flex flex-col bg-studio-base border-b lg:border-b-0 min-h-[320px]">
            <div
                class="h-9 border-b border-studio-border bg-studio-panel/60 px-3 flex items-center justify-between text-xs">
                <span id="currentEpisodeHeader"
                    class="font-bold text-cyan-400 truncate max-w-[240px]">អត្ថបទសន្ទនា</span>
                <span id="currentDialogueCount" class="text-[10px] text-slate-400">0 ឃ្លា</span>
            </div>

            <div id="dialogueContainer"
                class="flex-1 overflow-y-auto p-2.5 sm:p-3 space-y-2 max-h-[400px] lg:max-h-none">
                <div class="h-full flex flex-col items-center justify-center p-6 text-center text-slate-500 text-xs">
                    ជ្រើសរើសភាគ រួចចុច "Transcribe ភាគនេះ"
                </div>
            </div>
        </main>

        <!-- RIGHT: CONTROLS & RENDER -->
        <aside
            class="w-full lg:w-80 border-t lg:border-t-0 lg:border-l border-studio-border bg-studio-panel flex flex-col p-3 space-y-3">

            <!-- Video Monitor -->
            <div
                class="w-full aspect-[9/16] max-h-56 bg-black rounded-xl overflow-hidden border border-studio-border relative flex items-center justify-center mx-auto shadow-inner">
                <video id="player" playsinline controls class="w-full h-full object-contain hidden"></video>
                <div id="emptyPlayerNotice" class="text-center p-4">
                    <i data-lucide="film" class="w-8 h-8 text-slate-600 mx-auto mb-1"></i>
                    <span class="text-[11px] text-slate-500">ផ្ទាំងបញ្ចាំងវីដេអូ</span>
                </div>
            </div>

            <!-- Settings -->
            <div class="space-y-2 text-xs">
                <div class="p-2 rounded-xl bg-studio-card border border-studio-border space-y-1">
                    <span class="text-cyan-300 text-[10px] block font-bold">ភាសាដើមក្នុងវីដេអូ</span>
                    <select id="selSourceLang"
                        class="w-full bg-studio-base border border-studio-border rounded px-2 py-1 text-white text-[11px] outline-none">
                        <option value="auto" selected>🌐 Auto Detect</option>
                        <option value="zh">🇨🇳 ភាសាចិន (Chinese)</option>
                        <option value="en">🇺🇸 ភាសាអង់គ្លេស (English)</option>
                    </select>
                </div>

                <div
                    class="p-2.5 rounded-xl bg-gradient-to-r from-rose-950/40 to-studio-card border border-rose-500/50 space-y-1.5">
                    <span class="text-rose-300 text-[10px] block font-bold">AI Translation Model</span>
                    <select id="selModelSize" onchange="toggleCloudKeyInput()"
                        class="w-full bg-studio-base border border-rose-500/60 rounded px-2 py-1 text-white text-[11px] outline-none">
                        <option value="tiny" selected>⚡ Tiny Model (ស្រាល - សម្រាប់ Cloud)</option>
                        <option value="cloud_openai">☁️ OpenAI Cloud (GPT-4o-mini)</option>
                        <option value="cloud_groq">⚡ Groq Cloud (Ultra Fast)</option>
                    </select>
                    <div id="boxCloudKey" class="hidden pt-1">
                        <input type="password" id="txtCloudKey" placeholder="API Key..."
                            oninput="saveCloudKey(this.value)"
                            class="w-full bg-studio-base border border-rose-400 rounded px-2 py-1 text-white text-[10px] outline-none font-mono">
                    </div>
                </div>
            </div>

            <!-- Render Progress Container -->
            <div id="renderBox" class="p-3 rounded-xl bg-indigo-950/60 border border-indigo-500/50 space-y-2 text-xs">
                <div class="flex justify-between items-center text-[10px]">
                    <span id="renderStatus" class="text-cyan-300">រង់ចាំ Render...</span>
                    <span id="renderPercent" class="text-cyan-400 font-mono font-bold">0%</span>
                </div>
                <div class="w-full bg-studio-base h-2 rounded-full overflow-hidden border border-indigo-900">
                    <div id="renderProgressBar"
                        class="bg-gradient-to-r from-rose-500 to-indigo-500 h-full transition-all duration-300"
                        style="width: 0%"></div>
                </div>
                <div id="renderDownloadArea" class="pt-1 hidden">
                    <a id="btnDirectDownload" href="#" download
                        class="w-full py-2 px-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-lg font-bold flex items-center justify-center gap-2 text-xs">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span id="btnDownloadText">ទាញយកវីដេអូ</span>
                    </a>
                </div>
            </div>
        </aside>
    </div>

    <script>
        let episodeList = [];
        let activeIndex = -1;
        let localFileMap = {};
        let syncInterval = null;

        function toggleCloudKeyInput() {
            const modelVal = document.getElementById("selModelSize").value;
            const box = document.getElementById("boxCloudKey");
            const keyInput = document.getElementById("txtCloudKey");
            if (modelVal === "cloud_openai") {
                box.classList.remove("hidden");
                keyInput.value = localStorage.getItem("openai_key") || "";
            } else if (modelVal === "cloud_groq") {
                box.classList.remove("hidden");
                keyInput.value = localStorage.getItem("groq_key") || "";
            } else {
                box.classList.add("hidden");
            }
        }

        function saveCloudKey(val) {
            const modelVal = document.getElementById("selModelSize").value;
            if (modelVal === "cloud_openai") localStorage.setItem("openai_key", val.trim());
            if (modelVal === "cloud_groq") localStorage.setItem("groq_key", val.trim());
        }

        async function onFilesChosen(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            const fd = new FormData();
            files.forEach(f => fd.append("files", f));

            const res = await fetch("/api/batch-upload", { method: "POST", body: fd });
            const data = await res.json();
            files.forEach((f, idx) => {
                if (data.uploaded && data.uploaded[idx]) {
                    localFileMap[data.uploaded[idx].id] = URL.createObjectURL(f);
                }
            });

            await fetchEpisodes();
            if (episodeList.length > 0) pickEpisode(0);
            document.getElementById("btnExport").disabled = false;
        }

        async function fetchEpisodes() {
            try {
                const res = await fetch("/api/episodes");
                const data = await res.json();
                episodeList = Object.values(data);
                renderEpisodeSidebar();
                checkSync();
            } catch (e) { }
        }

        function renderEpisodeSidebar() {
            const box = document.getElementById("epList");
            if (!episodeList.length) {
                box.innerHTML = `<div class="text-center p-3 text-slate-500 text-xs">គ្មានវីដេអូ</div>`;
                return;
            }

            box.innerHTML = "";
            episodeList.forEach((ep, idx) => {
                const item = document.createElement("div");
                item.className = `p-2 rounded-lg border transition text-xs relative ${activeIndex === idx ? 'bg-cyan-950/60 border-cyan-500/80 ring-1 ring-cyan-500' : 'bg-studio-card border-studio-border'}`;
                const isDone = ep.status === "completed";
                const dlBtn = isDone ? `<a href="${ep.output_url}" download class="p-1 rounded bg-emerald-600 text-white"><i data-lucide="download" class="w-3 h-3"></i></a>` : '';

                item.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span onclick="pickEpisode(${idx})" class="font-bold text-white truncate max-w-[130px] flex items-center gap-1 cursor-pointer">
              <span class="px-1 bg-studio-base text-cyan-400 font-mono text-[9px]">${ep.code}</span>
              ${ep.filename}
            </span>
            <div class="flex items-center gap-1">
              ${dlBtn}
              <span class="text-[9px] text-cyan-300 font-mono">${ep.status}</span>
            </div>
          </div>
          <div onclick="pickEpisode(${idx})" class="w-full bg-studio-base h-1 rounded-full overflow-hidden cursor-pointer">
            <div class="${isDone ? 'bg-emerald-400' : 'bg-cyan-500'} h-full" style="width: ${ep.progress || 0}%"></div>
          </div>
        `;
                box.appendChild(item);
            });
            if (window.lucide) lucide.createIcons();
        }

        function pickEpisode(idx) {
            if (!episodeList[idx]) return;
            activeIndex = idx;
            renderEpisodeSidebar();

            const ep = episodeList[idx];
            document.getElementById("currentEpisodeHeader").innerText = `${ep.code} - ${ep.filename}`;
            document.getElementById("btnTranscribe").disabled = false;

            const p = document.getElementById("player");
            const emptyNotice = document.getElementById("emptyPlayerNotice");
            const previewSrc = localFileMap[ep.id] || (ep.output_url ? ep.output_url : null);

            if (previewSrc) {
                p.src = previewSrc;
                p.classList.remove("hidden");
                emptyNotice.classList.add("hidden");
            } else {
                p.classList.add("hidden");
                emptyNotice.classList.remove("hidden");
            }

            renderDialogues(ep.dialogues || []);
        }

        async function executeTranscribe(idx) {
            const ep = episodeList[idx];
            if (!ep) return;

            const fd = new FormData();
            fd.append("episode_id", ep.id);
            fd.append("model_size", document.getElementById("selModelSize").value || "tiny");
            fd.append("cloud_key", document.getElementById("txtCloudKey").value || "");
            fd.append("lang", document.getElementById("selSourceLang").value || "auto");
            fd.append("speaker_mode", "auto");

            const res = await fetch("/api/transcribe-episode", { method: "POST", body: fd });
            if (!res.ok) throw new Error(`Server Error (${res.status})`);
            const data = await res.json();
            ep.dialogues = data.dialogues || [];
            ep.status = "transcribed";

            if (idx === activeIndex) renderDialogues(ep.dialogues);
            renderEpisodeSidebar();
        }

        async function runTranscribeSingle() {
            if (activeIndex < 0) return;
            const btn = document.getElementById("btnTranscribe");
            const txt = document.getElementById("txtTranscribe");
            btn.disabled = true;
            txt.innerText = "⚡ កំពុង Transcribe...";
            try {
                await executeTranscribe(activeIndex);
                txt.innerText = "Transcribe ភាគនេះ";
            } catch (e) {
                alert("បរាជ័យ: " + e.message);
                txt.innerText = "សាកម្ដងទៀត";
            } finally {
                btn.disabled = false;
            }
        }

        function renderDialogues(dialogues) {
            const box = document.getElementById("dialogueContainer");
            document.getElementById("currentDialogueCount").innerText = `${(dialogues || []).length} ឃ្លា`;

            if (!dialogues || !dialogues.length) {
                box.innerHTML = `<div class="p-6 text-center text-amber-400 text-xs">មិនទាន់ Transcribe ទេ! ចុច "Transcribe ភាគនេះ"</div>`;
                return;
            }

            box.innerHTML = "";
            dialogues.forEach((d, i) => {
                const row = document.createElement("div");
                row.className = "p-2 rounded-xl border bg-studio-card border-studio-border text-xs space-y-1";
                row.innerHTML = `
          <div class="flex justify-between font-mono text-[10px] text-cyan-400"><span>${d.start}s - ${d.end}s</span><span>${d.speaker}</span></div>
          <div class="bg-studio-base p-1.5 rounded text-slate-400 text-[11px]">${d.original_text}</div>
          <textarea oninput="episodeList[${activeIndex}].dialogues[${i}].khmer_text = this.value" class="w-full bg-studio-base border border-studio-border rounded p-1.5 text-white text-[11px] outline-none" rows="2">${d.khmer_text}</textarea>
        `;
                box.appendChild(row);
            });
        }

        async function runExportBatch() {
            if (!episodeList.length) return;
            const dMap = {};
            episodeList.forEach(ep => { dMap[ep.id] = ep.dialogues || []; });

            document.getElementById("btnExport").disabled = true;
            document.getElementById("renderStatus").innerText = "⚡ កំពុង Render តាមជួរ...";

            const payload = {
                episode_ids: episodeList.map(e => e.id),
                merge_all_into_one: false,
                speaker_mode: "auto",
                speed_factor: 1.0,
                dub_volume: 2.20,
                burn_subtitles: true,
                sub_color: "&H00FFFF",
                aspect_ratio: "9:16",
                resolution: "1080p",
                dialogues_map: dMap
            };

            await fetch("/api/batch-render", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(checkSync, 1000);
        }

        async function checkSync() {
            try {
                const res = await fetch("/api/episodes");
                const data = await res.json();
                const serverEpisodes = Object.values(data);
                if (!serverEpisodes.length) return;

                episodeList = serverEpisodes;
                let completedCount = 0;
                let lastOutputUrl = null;

                serverEpisodes.forEach(ep => {
                    if (ep.status === "completed" && ep.output_url) {
                        completedCount++;
                        lastOutputUrl = ep.output_url;
                    }
                });

                const percent = Math.min(Math.round((completedCount / serverEpisodes.length) * 100), 100);
                document.getElementById("renderPercent").innerText = `${percent}%`;
                document.getElementById("renderProgressBar").style.width = `${percent}%`;

                if (completedCount > 0 && lastOutputUrl) {
                    const dlArea = document.getElementById("renderDownloadArea");
                    const dlBtn = document.getElementById("btnDirectDownload");
                    dlArea.classList.remove("hidden");
                    dlBtn.href = lastOutputUrl;
                    document.getElementById("btnDownloadText").innerText = `ទាញយកវីដេអូ (${completedCount}/${serverEpisodes.length} ភាគ)`;
                }

                renderEpisodeSidebar();

                if (completedCount === serverEpisodes.length && serverEpisodes.length > 0) {
                    clearInterval(syncInterval);
                    syncInterval = null;
                    document.getElementById("renderStatus").innerText = "✓ Render រួចរាល់ ១០០%!";
                    document.getElementById("btnExport").disabled = false;
                }
            } catch (e) {
                if (syncInterval) clearInterval(syncInterval);
            }
        }

        async function clearAllProjectEpisodes() {
            if (!confirm("សម្អាតវីដេអូទាំងអស់របស់អ្នក?")) return;
            await fetch("/api/clear-all-episodes", { method: "POST" });
            episodeList = [];
            activeIndex = -1;
            localFileMap = {};
            fetchEpisodes();
        }

        window.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) lucide.createIcons();
            fetchEpisodes();
            toggleCloudKeyInput();
        });
    </script>
</body>

</html>
